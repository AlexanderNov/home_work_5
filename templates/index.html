<!-- templates/index.html -->
{% extends "base.html" %}
{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Latest Reviews</h1>
    </div>

    <div class="row">
        {% for review in reviews %}
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="review-card p-4">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5 class="mb-1">
                                <a href="{{ url_for('review_detail', id=review.id) }}"
                                   class="text-decoration-none text-dark">
                                    {{ review.product_name }}
                                </a>
                            </h5>
                            <small class="text-muted">
                                By {{ review.author.username }} · {{ review.created_at.strftime('%b %d, %Y') }}
                            </small>
                        </div>
                        <div class="badge bg-primary rounded-pill">
                            {{ review.likes + review.dislikes }} votes
                        </div>
                    </div>

                    <div class="d-flex gap-2 vote-buttons">
                        <form method="POST"
                              action="{{ url_for('vote', id=review.id, vote_type='like') }}">
                            <button type="submit"
                                    class="btn btn-sm btn-outline-success">
                                👍 {{ review.likes }}
                            </button>
                        </form>
                        <form method="POST"
                              action="{{ url_for('vote', id=review.id, vote_type='dislike') }}">
                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger">
                                👎 {{ review.dislikes }}
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
